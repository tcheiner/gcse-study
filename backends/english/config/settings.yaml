# English grading backend settings. Edit here — nothing below is hardcoded in code.
llm:
  model: claude-opus-5-5
  effort: high            # low | medium | high | xhigh | max
  max_tokens: 16000
  use_fallbacks: true     # server-side refusal fallback (Claude API only)
  timeout_seconds: 120

logging:
  mode: debug             # debug | production
  dir: ../../logs         # relative to this backend folder

api:
  cors_origins:            # also the allowed Origin list for the CSRF check
    - http://localhost:3000
    - http://localhost:3100
    - https://y11-gcse.netlify.app
  rate_limit:
    requests: 10          # per client IP…
    window_seconds: 60    # …per this many seconds

limits:
  question_max_chars: 3000
  answer_min_chars: 50
  answer_max_chars: 15000

mark_schemes_dir: config/mark_schemes
prompts_dir: src/english_grader/prompts

# Student Claude keys: never stored. Sealed (AES-GCM) into a short-lived HttpOnly cookie.
session:
  cookie_name: gcse_key
  idle_minutes: 20        # forget after this long without use
  absolute_minutes: 120   # forget this long after entry, even if in use
  secure_cookie: true     # HTTPS only (browsers allow Secure cookies on http://localhost)
  same_site: strict
  key_prefix: sk-ant-
  key_max_chars: 300

secrets_file: ../../config/secrets.env

# Background jobs for slow Claude calls (in memory only; removed on first read).
jobs:
  ttl_seconds: 600            # forget unread results after this long
  max_pending_per_owner: 2    # per student session
  max_jobs: 500               # per server process
