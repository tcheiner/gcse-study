# DRAFT: paraphrased level descriptors. Verify bands against the official Pearson mark scheme.
tariff: 12
question_type: 'Extended response: analysis of how the writer uses language and structure'
marking: levels
assessment_objectives:
- code: AO1
  label: Read and understand
  descriptor: Read and understand a variety of texts, selecting and interpreting information, ideas and
    perspectives.
  student_summary: 'Show you understand the text: pick the right details and explain what they suggest.'
- code: AO2
  label: Analyse language and structure
  descriptor: Understand and analyse how writers use linguistic and structural devices to achieve their
    effects.
  student_summary: 'Explain HOW the writer creates effects: name the technique, quote it, and say what
    it does to the reader.'
levels:
- level: 0
  min: 0
  max: 0
  descriptor: No rewardable material.
  student_summary: Nothing yet earns marks. Answer the question using the text.
- level: 1
  min: 1
  max: 3
  descriptor: Basic awareness of the text; limited identification of methods with little explanation.
  student_summary: You mostly describe what happens. Start explaining what the writer's words do.
- level: 2
  min: 4
  max: 6
  descriptor: Some understanding; identifies some methods with straightforward comment on effect.
  student_summary: You spot techniques. Now explain their effect on the reader in more depth.
- level: 3
  min: 7
  max: 9
  descriptor: Clear, relevant understanding; explains methods and effects with well-chosen references.
  student_summary: Clear and relevant. Add detail on structure and explore layers of meaning.
- level: 4
  min: 10
  max: 12
  descriptor: Perceptive, critical analysis of language and structure; precise, discriminating references
    throughout.
  student_summary: Perceptive and critical throughout, with precise quotes and insightful analysis.
student_overview: This 12-mark question is marked by levels. The examiner reads your whole answer, decides
  which level description fits best, then picks a mark inside that level. Higher levels need precise quotations
  and analysis of HOW language and structure create effects, not just WHAT happens.
