# DRAFT: paraphrased level descriptors. Verify bands against the official Pearson mark scheme.
tariff: 9
question_type: 'Extended response: analysis of how the writer uses language and structure'
marking: levels
assessment_objectives:
- code: AO1
  label: Read and understand
  descriptor: Read and understand a variety of texts, selecting and interpreting information, ideas and
    perspectives.
  student_summary: 'Show you understand the text: pick the right details and explain what they suggest.'
- code: AO2
  label: Analyse language and structure
  descriptor: Understand and analyse how writers use linguistic and structural devices to achieve their
    effects.
  student_summary: 'Explain HOW the writer creates effects: name the technique, quote it, and say what
    it does to the reader.'
levels:
- level: 0
  min: 0
  max: 0
  descriptor: No rewardable material.
  student_summary: Nothing yet earns marks. Answer the question using the text.
- level: 1
  min: 1
  max: 3
  descriptor: Simple awareness with limited comment on language or structure; references sometimes irrelevant.
  student_summary: You mostly retell the text. Add quotes and explain what they show.
- level: 2
  min: 4
  max: 6
  descriptor: Clear, relevant explanation of the writer's methods and effects, supported by appropriate
    references.
  student_summary: Clear explanations. Push further by exploring alternative meanings and structure.
- level: 3
  min: 7
  max: 9
  descriptor: Perceptive, sustained analysis of language and structure; precise, discriminating references.
  student_summary: 'Sustained, perceptive analysis: you judge how and why the methods work.'
student_overview: This 9-mark question is marked by levels. The examiner reads your whole answer, decides
  which level description fits best, then picks a mark inside that level. Higher levels need precise quotations
  and analysis of HOW language and structure create effects, not just WHAT happens.
