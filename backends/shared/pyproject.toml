[project]
name = "gcse-shared"
version = "0.1.0"
description = "Shared logging, config and LLM helpers for GCSE subject grading backends"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.70",
  "pydantic>=2.8",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gcse_shared"]
