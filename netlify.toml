# Netlify builds the Next.js frontend from the frontend/ folder.
# Set ENGLISH_API_URL in Netlify (Site configuration > Environment variables) to the Render backend URL;
# next.config.ts proxies /api/english/* there, so the key cookie stays on this site.
[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Run Netlify's Next.js runtime (server rendering, rewrites, headers). Without it the
# raw .next folder is published as static files and every route returns 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"
