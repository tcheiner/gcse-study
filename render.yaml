# Render Blueprint for the subject backends.
# Secrets are NOT in this file: set KEY_ENCRYPTION_KEY in the Render dashboard (copy it from config/secrets.env).
services:
  - type: web
    name: gcse-english-api
    runtime: python
    rootDir: backends/english
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # Runs the venv built above directly (no re-sync at start).
    # --proxy-headers so rate limiting sees the student's IP, not Netlify's/Render's proxy.
    startCommand: .venv/bin/uvicorn english_grader.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: KEY_ENCRYPTION_KEY
        sync: false
